name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read # Required for checking out code
  id-token: write # Required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v${package_version}" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi

          git fetch origin main --no-tags
          release_commit="$(git rev-parse 'HEAD^{commit}')"
          main_commit="$(git rev-parse 'origin/main^{commit}')"
          if ! git merge-base --is-ancestor "$release_commit" "$main_commit"; then
            echo "::error::Release commit $release_commit is not in the current main history"
            exit 1
          fi

      - name: Run cicheck
        run: pnpm cicheck

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --no-git-checks
