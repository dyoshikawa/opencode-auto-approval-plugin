# yaml-language-server: $schema=https://json.schemastore.org/pnpm-workspace.json
# Postinstall scripts stay blocked by default; add packages here only when a
# build step is genuinely required.
allowBuilds:
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  simple-git-hooks: false
  tldjs: false
ignoreScripts: false
# Refuse dependency versions published less than a day ago, so a compromised
# release has time to be pulled before it lands in a lockfile.
minimumReleaseAge: 1440 # 1 day
# cspell:ignore mrhx
# Development-only fixes for advisories in versions that @opencode-ai/plugin
# 1.19.x pins exactly: toml <=5.0.0 through effect (GHSA-4qx8-w7c3-pj3p,
# GHSA-9j65-hcg3-gc64, GHSA-9qmh-m7c6-f92p) and zod <4.6.6
# (GHSA-mrhx-c7xc-m3w5). Overrides are not published, so users are unaffected;
# drop them once the plugin package moves past these versions.
overrides:
  "effect>toml": 5.0.1
  "@opencode-ai/plugin>zod": 4.6.7
