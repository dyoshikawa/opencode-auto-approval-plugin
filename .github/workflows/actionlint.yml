name: Actionlint

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.*"
      - "mise.toml"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true

      - name: Run actionlint
        run: mise run actionlint
