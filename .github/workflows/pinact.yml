name: Pinact

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".pinact.yaml"
      - "mise.toml"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  pinact:
    name: Verify Actions Are Pinned To Commit SHAs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          experimental: true

      # `pinact run --check` resolves each `uses:` ref through the GitHub API,
      # so a token is required to stay within the API rate limit.
      - name: Run pinact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run pinact:check
